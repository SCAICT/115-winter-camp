<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0b" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="SCAICT" />

    <!-- 標題、摘要、社群分享與結構化資料由 vite.config.js 讀取 siteSeo.js 產生。 -->
    <link rel="icon" href="/favicon.ico?v=9b7c5a9c" type="image/x-icon" sizes="16x16 32x32 48x48" />

    <style>
      html, body { background: #0b0b0b; }
      #root { visibility: hidden; opacity: 0; transition: opacity .6s ease; }
      #font-loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #aaa;
        background: #0b0b0b;
        font: 12px system-ui, sans-serif;
        letter-spacing: .12em;
      }
      html.fonts-ready #root { visibility: visible; opacity: 1; }
      html.fonts-ready #font-loading { display: none; }
      @media (prefers-reduced-motion: reduce) {
        #root { transition: none; }
      }
    </style>

    <noscript>
      <style>
        #root { visibility: visible; opacity: 1; }
        .hero__eyebrow, .hero h1 > span, .hero__divider, .hero__description, .hero__content > .button, .hero__dates { animation: none !important; }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
